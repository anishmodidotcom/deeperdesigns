<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="IG post template — Big statement">
  <title>IG post template · Big statement</title>
  <defs>
    <radialGradient id="stmtGlow" cx="100%" cy="0%" r="80%">
      <stop offset="0%"  stop-color="#7C6CFF" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#7C6CFF" stop-opacity="0"/>
    </radialGradient>
    <style>
      .eyebrow { font-family: "Geist Mono", ui-monospace, monospace; font-size: 18px; font-weight: 500; letter-spacing: 0.30em; fill: #6B6B6B; text-transform: uppercase; }
      .quote   { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 84px; font-weight: 400; fill: #F5F5F5; }
      .quoteAcc{ font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 84px; font-weight: 400; fill: #7C6CFF; }
      .handle  { font-family: "Geist Mono", ui-monospace, monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.20em; fill: #A8A8A8; text-transform: uppercase; }
      .placeholder { font-family: "Geist Mono", ui-monospace, monospace; font-size: 14px; fill: #3A3A3A; letter-spacing: 0.10em; }
    </style>
  </defs>

  <rect width="1080" height="1080" fill="#0A0A0A"/>
  <rect width="1080" height="1080" fill="url(#stmtGlow)"/>

  <!-- Hairline top -->
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="80" y1="120" x2="1000" y2="120"/>
    <line x1="80" y1="960" x2="1000" y2="960"/>
  </g>

  <text class="eyebrow" x="80" y="92">DEEPER DESIGNS · A NOTE</text>

  <!-- Big quote, placeholder lines. Editorial italic with one indigo accent fragment. -->
  <text class="quote"     x="80" y="400">[ statement here. ]</text>
  <text class="quote"     x="80" y="510">[ two lines max. ]</text>
  <text class="quoteAcc"  x="80" y="620">[ one accent. ]</text>
  <text class="quote"     x="80" y="730">[ no quote marks. ]</text>

  <!-- Bottom monogram + handle -->
  <g transform="translate(80, 1006)" fill="#F5F5F5" fill-rule="evenodd">
    <g transform="scale(1.25)">
      <path d="M4 0 L16 0 A12 16 0 0 1 16 32 L4 32 Z M10 6 L16 6 A6 10 0 0 1 16 26 L10 26 Z"/>
      <path d="M36 0 L48 0 A12 16 0 0 1 48 32 L36 32 Z M42 6 L48 6 A6 10 0 0 1 48 26 L42 26 Z"/>
    </g>
  </g>
  <rect x="76" y="1023" width="84" height="5" fill="#0A0A0A"/>
  <text class="handle" x="180" y="1043">@DEEPERDESIGNSCO</text>
  <text class="handle" x="1000" y="1043" text-anchor="end">DEEPERDESIGNS.IN</text>

  <text class="placeholder" x="540" y="1075" text-anchor="middle">TEMPLATE — REPLACE BRACKETED TEXT</text>
</svg>
