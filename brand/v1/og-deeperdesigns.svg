<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="Deeper Designs">
  <title>Deeper Designs · default OG image</title>
  <defs>
    <style>
      .eyebrow  { font-family: "Geist Mono", ui-monospace, monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.24em; fill: #6B6B6B; text-transform: uppercase; }
      .wordmark { font-family: "Geist", Inter, system-ui, sans-serif; font-size: 108px; font-weight: 600; letter-spacing: 0.04em; fill: #F5F5F5; }
      .tagline  { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 38px; font-weight: 400; fill: #A8A8A8; }
      .url      { font-family: "Geist Mono", ui-monospace, monospace; font-size: 13px; letter-spacing: 0.22em; fill: #A8A8A8; text-transform: uppercase; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#0A0A0A"/>

  <!-- Subtle indigo glow in top-left corner -->
  <defs>
    <radialGradient id="cornerGlow" cx="0%" cy="0%" r="60%">
      <stop offset="0%"  stop-color="#6366F1" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#cornerGlow)"/>

  <!-- Hairlines -->
  <g stroke="rgba(255,255,255,0.05)" stroke-width="1">
    <line x1="0" y1="100" x2="1200" y2="100"/>
    <line x1="0" y1="530" x2="1200" y2="530"/>
  </g>

  <text class="eyebrow" x="600" y="62" text-anchor="middle">AI-POWERED BUILD STUDIO · INDIA-FIRST</text>

  <!-- Centered wordmark -->
  <text class="wordmark" x="600" y="290" text-anchor="middle">DEEPER DESIGNS</text>

  <!-- Italic serif tagline, centered -->
  <text class="tagline" x="600" y="360" text-anchor="middle">Custom tools, built around how</text>
  <text class="tagline" x="600" y="408" text-anchor="middle">your business actually works.</text>

  <!-- Bottom-left: small monogram + url -->
  <g transform="translate(60, 552)" fill="#6366F1" fill-rule="evenodd">
    <g transform="scale(0.9375)">
      <path d="M4 0 L16 0 A12 16 0 0 1 16 32 L4 32 Z M10 6 L16 6 A6 10 0 0 1 16 26 L10 26 Z"/>
      <path d="M36 0 L48 0 A12 16 0 0 1 48 32 L36 32 Z M42 6 L48 6 A6 10 0 0 1 48 26 L42 26 Z"/>
    </g>
  </g>
  <rect x="55" y="565" width="70" height="4" fill="#0A0A0A"/>
  <text class="url" x="140" y="582">DEEPERDESIGNS.IN</text>

  <text class="url" x="1140" y="582" text-anchor="end">FROM ₹25,000</text>
</svg>
