<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" role="img" aria-label="IG post template — Bottleneck diagnosis">
  <title>IG post template · Bottleneck diagnosis</title>
  <defs>
    <style>
      .eyebrow   { font-family: "Geist Mono", ui-monospace, monospace; font-size: 16px; font-weight: 500; letter-spacing: 0.28em; fill: #6366F1; text-transform: uppercase; }
      .setup     { font-family: "Geist", Inter, system-ui, sans-serif; font-size: 38px; font-weight: 500; letter-spacing: -0.01em; fill: #F5F5F5; }
      .diagnosis { font-family: "Geist", Inter, system-ui, sans-serif; font-size: 32px; font-weight: 400; letter-spacing: -0.01em; fill: #A8A8A8; }
      .diagAcc   { font-family: "Instrument Serif", Georgia, serif; font-style: italic; font-size: 36px; fill: #6366F1; }
      .label     { font-family: "Geist Mono", ui-monospace, monospace; font-size: 12px; font-weight: 500; letter-spacing: 0.22em; fill: #6B6B6B; text-transform: uppercase; }
      .visText   { font-family: "Geist Mono", ui-monospace, monospace; font-size: 16px; fill: #3A3A3A; letter-spacing: 0.10em; text-transform: uppercase; }
      .handle    { font-family: "Geist Mono", ui-monospace, monospace; font-size: 14px; font-weight: 500; letter-spacing: 0.20em; fill: #A8A8A8; text-transform: uppercase; }
      .placeholder { font-family: "Geist Mono", ui-monospace, monospace; font-size: 14px; fill: #3A3A3A; letter-spacing: 0.10em; }
    </style>
  </defs>

  <rect width="1080" height="1080" fill="#0A0A0A"/>
  <g stroke="rgba(255,255,255,0.06)" stroke-width="1">
    <line x1="80" y1="120" x2="1000" y2="120"/>
    <line x1="80" y1="960" x2="1000" y2="960"/>
  </g>

  <!-- TOP THIRD — setup -->
  <text class="eyebrow" x="80" y="92">BOTTLENECK · 001</text>
  <text class="label"   x="80" y="180">THE SETUP</text>
  <text class="setup"   x="80" y="240">[ One-line setup sentence in Geist.   ]</text>
  <text class="setup"   x="80" y="290">[ Up to two lines if needed.          ]</text>

  <!-- MIDDLE — visualization placeholder -->
  <g>
    <rect x="80" y="360" width="920" height="380" fill="#111111" stroke="rgba(255,255,255,0.10)" stroke-width="1"/>
    <text class="visText" x="540" y="556" text-anchor="middle">[ SCREENSHOT · DIAGRAM · MOCKUP ]</text>
    <line x1="80"  y1="360" x2="100" y2="380" stroke="rgba(255,255,255,0.10)"/>
    <line x1="1000" y1="360" x2="980" y2="380" stroke="rgba(255,255,255,0.10)"/>
    <line x1="80"  y1="740" x2="100" y2="720" stroke="rgba(255,255,255,0.10)"/>
    <line x1="1000" y1="740" x2="980" y2="720" stroke="rgba(255,255,255,0.10)"/>
  </g>

  <!-- BOTTOM THIRD — diagnosis -->
  <text class="label"     x="80" y="800">THE DIAGNOSIS</text>
  <text class="diagnosis" x="80" y="860">[ Diagnosis line. Plain. Direct. ]</text>
  <text class="diagAcc"   x="80" y="912">[ Italic accent if useful.       ]</text>

  <!-- Footer -->
  <g transform="translate(80, 1006)" fill="#F5F5F5" fill-rule="evenodd">
    <g transform="scale(1.25)">
      <path d="M4 0 L16 0 A12 16 0 0 1 16 32 L4 32 Z M10 6 L16 6 A6 10 0 0 1 16 26 L10 26 Z"/>
      <path d="M36 0 L48 0 A12 16 0 0 1 48 32 L36 32 Z M42 6 L48 6 A6 10 0 0 1 48 26 L42 26 Z"/>
    </g>
  </g>
  <rect x="76" y="1023" width="84" height="5" fill="#0A0A0A"/>
  <text class="handle" x="180" y="1043">@DEEPERDESIGNSCO</text>
  <text class="handle" x="1000" y="1043" text-anchor="end">DEEPERDESIGNS.IN</text>
  <text class="placeholder" x="540" y="1075" text-anchor="middle">TEMPLATE — PILLAR 1 (BOTTLENECK)</text>
</svg>
