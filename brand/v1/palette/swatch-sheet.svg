      .h2     { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 13px; font-weight: 500; letter-spacing: 0.18em; fill: #6B6B6B; text-transform: uppercase; }
      .name   { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; fill: #F5F5F5; text-transform: uppercase; }
      .nameLt { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; font-weight: 500; letter-spacing: 0.08em; fill: #0A0A0A; text-transform: uppercase; }
      .hex    { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; fill: #A8A8A8; letter-spacing: 0.04em; }
      .hexLt  { font-family: 'Geist Mono', ui-monospace, monospace; font-size: 10px; fill: rgba(10,10,10,0.7); letter-spacing: 0.04em; }
      .frame  { fill: none; stroke: rgba(255,255,255,0.08); stroke-width: 1; }
      .note   { font-family: 'Geist', Inter, system-ui, sans-serif; font-size: 12px; fill: #6B6B6B; }
